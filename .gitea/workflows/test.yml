# Runs the test suite (main_test.go) on every push to main. These are
# integration tests that build and run the real binary as subprocesses in
# both sender and receiver roles, entirely over localhost via LEFI_LOCAL -
# no Cloudflare tunnel, no outbound network access needed.

name: test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        run: |
          set -e
          case "$(uname -m)" in
            x86_64) GOARCH_HOST=amd64 ;;
            aarch64|arm64) GOARCH_HOST=arm64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://go.dev/dl/go1.26.0.linux-${GOARCH_HOST}.tar.gz" -o /tmp/go.tar.gz
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Cache Go modules and build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-test-

      - name: go vet
        run: |
          set -e
          export PATH="/usr/local/go/bin:$PATH"
          go vet ./...

      - name: go test
        run: |
          set -e
          export PATH="/usr/local/go/bin:$PATH"
          # Race detection needs ThreadSanitizer, which refuses to run on
          # some arm64 hosts ("unsupported VMA range" - a kernel/CPU
          # addressing mismatch TSan itself can't work around). Try with
          # -race first; only fall back to a plain run if that's why it
          # failed, so an actual race (or any other failure) still fails
          # the build.
          if go test -race -count=1 -timeout 180s -v ./... 2>&1 | tee /tmp/go-test.log; then
            exit 0
          fi
          if grep -q "ThreadSanitizer: unsupported VMA range" /tmp/go-test.log; then
            echo "::warning::-race unsupported on this runner (ThreadSanitizer VMA mismatch) - re-running without it"
            go test -count=1 -timeout 180s -v ./...
          else
            exit 1
          fi
